plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.secure_vault_app"
    compileSdk = 36
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.example.secure_vault_app"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    flavorDimensions += ["environment", "distribution"]

    productFlavors {
        development {
            dimension "environment"
            versionNameSuffix "-dev"
            manifestPlaceholders = [appLabel: "Secure Vault Dev"]
            buildConfigField "String", "APP_ENVIRONMENT", '"development"'
        }
        staging {
            dimension "environment"
            versionNameSuffix "-staging"
            manifestPlaceholders = [appLabel: "Secure Vault Staging"]
            buildConfigField "String", "APP_ENVIRONMENT", '"staging"'
        }
        production {
            dimension "environment"
            manifestPlaceholders = [appLabel: "Secure Vault"]
            buildConfigField "String", "APP_ENVIRONMENT", '"production"'
        }

        internal {
            dimension "distribution"
            buildConfigField "String", "APP_DISTRIBUTION", '"internal"'
        }
        store {
            dimension "distribution"
            buildConfigField "String", "APP_DISTRIBUTION", '"store"'
        }
    }

    buildTypes {
        release {
            // Production signing must be configured before store distribution.
        }
    }
}

flutter {
    source = "../.."
}
