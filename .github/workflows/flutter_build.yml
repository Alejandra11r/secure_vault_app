name: Flutter CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Análisis y pruebas
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.6"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: coverage/lcov.info

  android-flavors:
    name: Compilar ${{ matrix.environment }} / ${{ matrix.distribution }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        environment: [development, staging, production]
        distribution: [internal, store]

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.6"
          channel: stable
          cache: true

      - name: Usar Java 17 en Flutter
        run: |
          flutter config --jdk-dir="$JAVA_HOME"

      - name: Aceptar licencias del SDK de Android
        run: yes | flutter doctor --android-licenses

      - name: Verificar Java, Flutter y Gradle
        run: |
          echo "JAVA_HOME: $JAVA_HOME"
          java -version
          flutter --version
          cd android
          ./gradlew --version

      - name: Instalar dependencias
        run: flutter pub get

      - name: Compilar APK de verificación
        run: >-
          flutter build apk --debug
          --flavor "${{ matrix.environment }}${{ matrix.distribution == 'internal' && 'Internal' || 'Store' }}"
          --dart-define=APP_ENV=${{ matrix.environment }}
          --dart-define=APP_DISTRIBUTION=${{ matrix.distribution }}

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.environment }}-${{ matrix.distribution }}
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
