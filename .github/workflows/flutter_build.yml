name: Flutter CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Analyze and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.6"
          channel: stable
          cache: true
      
      - name: Force Flutter to use Java 17
        run: |
          flutter config --jdk-dir="$JAVA_HOME"
          flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run unit and widget tests
        run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: coverage/lcov.info

  android-flavors:
    needs: quality
    name: Build ${{ matrix.environment }} / ${{ matrix.distribution }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [development, staging, production]
        distribution: [internal, store]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.6"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build flavor smoke APK
        run: >-
          flutter build apk --debug
          --flavor "${{ matrix.environment }}${{ matrix.distribution == 'internal' && 'Internal' || 'Store' }}"
          --dart-define=APP_ENV=${{ matrix.environment }}
          --dart-define=APP_DISTRIBUTION=${{ matrix.distribution }}

      - name: Upload flavor APK
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.environment }}-${{ matrix.distribution }}
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
